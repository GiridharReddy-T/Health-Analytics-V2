name: Health Analytics CI/CD
# Triggers:
#   CI (test job)     : every push + PR → main / develop
#   Deploy Test       : push to main (non-PR) OR v* tag push  → test_catalog
#   Deploy Prod       : v* tag push → prod_catalog  (requires 'production' env approval)
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   DATABRICKS_HOST   e.g. https://adb-7405614261161185.5.azuredatabricks.net
#   DATABRICKS_TOKEN  personal access token with Jobs + Bundle permissions
#
# Required GitHub Environment (Settings → Environments):
#   production        add at least one required reviewer to gate prod deploys

on:
  push:
    branches: [main, develop]
    tags: ['v*']          # v1.0.0, v1.2.3, etc. — triggers Deploy Test + Prod
  pull_request:
    branches: [main, develop]

jobs:
  # ── Stage 1: CI ──────────────────────────────────────────────────────────────
  test:
    name: CI — Unit Tests
    # Pin to ubuntu-24.04 to avoid breaking changes when ubuntu-latest moves to Ubuntu 26 on October 19, 2026
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # FIX: Upgraded from v4 to v5 to remove the deprecation warning and run natively on Node 24
      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyspark pytest pytest-mock databricks-sdk
          [ -f requirements.txt ] && pip install -r requirements.txt || true

      - name: Run unit tests
        run: |
          PYTHONPATH=. python -m pytest tests/ -v --tb=short

  # ── Stage 2: Deploy Test ───────────────────────────────────────────────
  deploy-test:
    name: Deploy → test_catalog
    needs: test
    # Run on: merge to main (non-PR) OR any v* tag push
    if: |
      github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Bundle validate (test)
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate --target test

      - name: Bundle deploy (test)
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy --target test

  # ── Stage 3: Deploy Prod ───────────────────────────────────────────────
  deploy-prod:
    name: Deploy → prod_catalog
    needs: [test, deploy-test]
    # Run only on v* tag pushes; 'production' environment gates it with manual approval
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: production   # ← add required reviewers in GitHub Settings → Environments

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Bundle validate (prod)
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate --target prod

      - name: Bundle deploy (prod)
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy --target prod
