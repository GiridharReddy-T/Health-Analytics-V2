trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  # Using Ubuntu 24.04 to remain aligned with your working GitHub environment
  vmImage: 'ubuntu-24.04'

variables:
  # Ensures PySpark's JVM launcher knows exactly where to find your modules
  PYTHONPATH: '$(System.DefaultWorkingDirectory)'

steps:
  # 1. Set up the specific Python runtime version
  - task: UsePythonVersion@0
    displayName: 'Set up Python 3.10'
    inputs:
      versionSpec: '3.10'
      addToPath: true

  # 2. Set up the Java version required by the PySpark JVM core engine layer
  - task: JavaToolInstaller@0
    displayName: 'Set up Java JDK 17'
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  # 3. Install application dependencies
  - script: |
      python -m pip install --upgrade pip
      pip install pyspark pytest pytest-mock databricks-sdk
      if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    displayName: 'Install Dependencies'

  # 4. Run PyTest and capture test metrics
  - script: |
      python -m pytest tests/ -v --junitxml=$(Build.ArtifactStagingDirectory)/test-results.xml
    displayName: 'Run Unit Tests'

  # 5. Publish test results directly to the Azure DevOps Pipeline dashboard
  - task: PublishTestResults@2
    displayName: 'Publish Test Results'
    condition: succeededOrFailed() # Runs even if your tests fail so you see the breakdown
    inputs:
      testResultsFiles: '$(Build.ArtifactStagingDirectory)/test-results.xml'
      testRunTitle: 'PySpark Unit Tests'
